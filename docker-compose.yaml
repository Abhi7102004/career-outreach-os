services:
  postgres:
    image: postgres:18-alpine
    container_name: careeroutreach-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: careeroutreach_os
      POSTGRES_USER: careeroutreach_os
      POSTGRES_PASSWORD: careeroutreach_os_dev
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U careeroutreach_os -d careeroutreach_os" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: careeroutreach-os-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
