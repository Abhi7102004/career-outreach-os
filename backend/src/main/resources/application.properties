spring.application.name=backend

# Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/careeroutreach_os}
spring.datasource.username=${DB_USER:careeroutreach_os}
spring.datasource.password=${DB_PASSWORD:careeroutreach_os_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}